<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold" letter-spacing="1">TASKTRACK DATABASE ERD (POSTGRESQL)</text>
  <text x="500" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">PRN232 Practical Exam 1 &#8226;#8226; Entity-Relationship Diagram</text>

  <!-- TABLE: Department -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="260" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="260" height="40" rx="10" fill="url(#headerGrad)"/>
    <rect width="260" height="10" y="30" fill="url(#headerGrad)"/>
    <text x="130" y="26" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">Department</text>
    <text x="20" y="65" fill="#38bdf8" font-size="13" font-family="monospace">PK</text>
    <text x="55" y="65" fill="#f8fafc" font-size="13">DepartmentID</text>
    <text x="200" y="65" fill="#94a3b8" font-size="12">INT</text>
    <line x1="15" y1="75" x2="245" y2="75" stroke="#334155" stroke-width="1"/>
    <text x="55" y="100" fill="#f8fafc" font-size="13">DepartmentName</text>
    <text x="180" y="100" fill="#94a3b8" font-size="12">VARCHAR(100)</text>
    <text x="55" y="130" fill="#f8fafc" font-size="13">DepartmentDesc</text>
    <text x="180" y="130" fill="#94a3b8" font-size="12">VARCHAR(300)</text>
    <text x="55" y="160" fill="#f8fafc" font-size="13">IsActive</text>
    <text x="190" y="160" fill="#94a3b8" font-size="12">BOOLEAN</text>
  </g>

  <!-- TABLE: Project -->
  <g transform="translate(370, 110)" filter="url(#shadow)">
    <rect width="270" height="280" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="40" rx="10" fill="url(#headerGrad)"/>
    <rect width="270" height="10" y="30" fill="url(#headerGrad)"/>
    <text x="135" y="26" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">Project</text>
    <text x="20" y="65" fill="#38bdf8" font-size="13" font-family="monospace">PK</text>
    <text x="55" y="65" fill="#f8fafc" font-size="13">ProjectID</text>
    <text x="210" y="65" fill="#94a3b8" font-size="12">INT</text>
    <text x="20" y="95" fill="#fbbf24" font-size="13" font-family="monospace">FK</text>
    <text x="55" y="95" fill="#f8fafc" font-size="13">DepartmentID</text>
    <text x="210" y="95" fill="#94a3b8" font-size="12">INT</text>
    <line x1="15" y1="105" x2="255" y2="105" stroke="#334155" stroke-width="1"/>
    <text x="55" y="130" fill="#f8fafc" font-size="13">ProjectName</text>
    <text x="180" y="130" fill="#94a3b8" font-size="12">VARCHAR(200)</text>
    <text x="55" y="160" fill="#f8fafc" font-size="13">Description</text>
    <text x="210" y="160" fill="#94a3b8" font-size="12">TEXT</text>
    <text x="55" y="190" fill="#f8fafc" font-size="13">StartDate</text>
    <text x="210" y="190" fill="#94a3b8" font-size="12">DATE</text>
    <text x="55" y="220" fill="#f8fafc" font-size="13">EndDate</text>
    <text x="210" y="220" fill="#94a3b8" font-size="12">DATE</text>
    <text x="55" y="245" fill="#f8fafc" font-size="13">Status</text>
    <text x="190" y="245" fill="#94a3b8" font-size="12">SMALLINT</text>
    <text x="55" y="270" fill="#f8fafc" font-size="13">IsActive</text>
    <text x="190" y="270" fill="#94a3b8" font-size="12">BOOLEAN</text>
  </g>

  <!-- TABLE: Task -->
  <g transform="translate(690, 110)" filter="url(#shadow)">
    <rect width="260" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="260" height="40" rx="10" fill="url(#headerGrad)"/>
    <rect width="260" height="10" y="30" fill="url(#headerGrad)"/>
    <text x="130" y="26" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">Task</text>
    <text x="20" y="65" fill="#38bdf8" font-size="13" font-family="monospace">PK</text>
    <text x="55" y="65" fill="#f8fafc" font-size="13">TaskID</text>
    <text x="200" y="65" fill="#94a3b8" font-size="12">INT</text>
    <text x="20" y="95" fill="#fbbf24" font-size="13" font-family="monospace">FK</text>
    <text x="55" y="95" fill="#f8fafc" font-size="13">ProjectID</text>
    <text x="200" y="95" fill="#94a3b8" font-size="12">INT</text>
    <line x1="15" y1="105" x2="245" y2="105" stroke="#334155" stroke-width="1"/>
    <text x="55" y="130" fill="#f8fafc" font-size="13">Title</text>
    <text x="170" y="130" fill="#94a3b8" font-size="12">VARCHAR(300)</text>
    <text x="55" y="160" fill="#f8fafc" font-size="13">Description</text>
    <text x="200" y="160" fill="#94a3b8" font-size="12">TEXT</text>
    <text x="55" y="190" fill="#f8fafc" font-size="13">Status</text>
    <text x="180" y="190" fill="#94a3b8" font-size="12">SMALLINT</text>
    <text x="55" y="220" fill="#f8fafc" font-size="13">Priority</text>
    <text x="180" y="220" fill="#94a3b8" font-size="12">SMALLINT</text>
    <text x="55" y="250" fill="#f8fafc" font-size="13">DueDate</text>
    <text x="200" y="250" fill="#94a3b8" font-size="12">DATE</text>
    <text x="55" y="280" fill="#f8fafc" font-size="13">IsActive</text>
    <text x="180" y="280" fill="#94a3b8" font-size="12">BOOLEAN</text>
    <text x="55" y="305" fill="#f8fafc" font-size="13">CreatedDate</text>
    <text x="170" y="305" fill="#94a3b8" font-size="12">TIMESTAMP</text>
  </g>

  <!-- TABLE: TaskTag -->
  <g transform="translate(540, 460)" filter="url(#shadow)">
    <rect width="220" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="220" height="35" rx="10" fill="url(#headerGrad)"/>
    <rect width="220" height="10" y="25" fill="url(#headerGrad)"/>
    <text x="110" y="23" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">TaskTag (Join)</text>
    <text x="15" y="58" fill="#38bdf8" font-size="12" font-family="monospace">PK,FK</text>
    <text x="65" y="58" fill="#f8fafc" font-size="13">TaskID</text>
    <text x="165" y="58" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="88" fill="#38bdf8" font-size="12" font-family="monospace">PK,FK</text>
    <text x="65" y="88" fill="#f8fafc" font-size="13">TagID</text>
    <text x="165" y="88" fill="#94a3b8" font-size="12">INT</text>
  </g>

  <!-- TABLE: Tag -->
  <g transform="translate(180, 460)" filter="url(#shadow)">
    <rect width="240" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="35" rx="10" fill="url(#headerGrad)"/>
    <rect width="240" height="10" y="25" fill="url(#headerGrad)"/>
    <text x="120" y="23" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">Tag</text>
    <text x="15" y="58" fill="#38bdf8" font-size="13" font-family="monospace">PK</text>
    <text x="55" y="58" fill="#f8fafc" font-size="13">TagID</text>
    <text x="180" y="58" fill="#94a3b8" font-size="12">INT</text>
    <line x1="15" y1="68" x2="225" y2="68" stroke="#334155" stroke-width="1"/>
    <text x="55" y="90" fill="#f8fafc" font-size="13">TagName</text>
    <text x="145" y="90" fill="#94a3b8" font-size="12">VARCHAR(50)</text>
    <text x="55" y="115" fill="#f8fafc" font-size="13">Color</text>
    <text x="165" y="115" fill="#94a3b8" font-size="12">VARCHAR(7)</text>
  </g>

  <!-- Connectors -->
  <!-- Department -> Project -->
  <path d="M 310 180 L 370 180" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
  <circle cx="315" cy="180" r="4" fill="#818cf8"/>
  <polygon points="368,175 378,180 368,185" fill="#818cf8"/>

  <!-- Project -> Task -->
  <path d="M 640 200 L 690 200" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
  <circle cx="645" cy="200" r="4" fill="#818cf8"/>
  <polygon points="688,195 698,200 688,205" fill="#818cf8"/>

  <!-- Task -> TaskTag -->
  <path d="M 760 430 L 760 520 L 760 520" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
  <polygon points="755,462 760,452 765,462" fill="#a78bfa"/>

  <!-- Tag -> TaskTag -->
  <path d="M 420 525 L 540 525" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
  <circle cx="425" cy="525" r="4" fill="#a78bfa"/>
  <polygon points="538,520 548,525 538,530" fill="#a78bfa"/>
</svg>